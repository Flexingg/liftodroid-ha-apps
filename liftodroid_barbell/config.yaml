name: LiftoDroid Barbell Camera
version: "0.1.3"
slug: liftodroid_barbell
description: Reads the weight on your barbell from an overhead gym camera, for LiftoDroid
url: https://github.com/Flexingg/Liftodroid
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - mqtt:want
hassio_api: true
homeassistant_api: true
map:
  - addon_config:rw
options:
  log_level: info
  config_file: /config/barbell.yaml
  discovery_prefix: homeassistant
schema:
  log_level: list(debug|info|warning|error)
  config_file: str
  # RTSP(S) URL of the overhead camera. Holds credentials, so it's a password field.
  camera_url: password?
  # Or, without a stream URL: a camera entity to take snapshots from (slower).
  camera_entity: str?
  # Optional: an entity that is "on" while someone is in the rack (e.g. a VisionState person sensor).
  person_entity: str?
  # Setup that overrides barbell.yaml, so the app can be configured entirely from here (see Documentation).
  unit: list(lb|kg)?
  bar_weight: float?
  # weight[xcount]:diameter_mm/thickness_mm, comma separated, e.g. "45:450/76, 25:450/43, 10:450/25"
  plates: str?
  # Fractions of the (undistorted) frame: "x,y x,y x,y x,y" around the sleeve and its plates
  sleeve_roi: str?
  # "x,y x,y": collar, then sleeve tip (only used when use_shape is on)
  sleeve_axis: str?
  sleeve_length_mm: float?
  # Measure plate slabs along the sleeve (needs a side-on view of it)
  use_shape: bool?
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
