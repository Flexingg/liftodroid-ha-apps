name: LiftoDroid Barbell Camera
version: "0.2.0"
slug: liftodroid_barbell
description: Reads the weight on your barbell from an overhead gym camera, for LiftoDroid
url: https://github.com/Flexingg/Liftodroid
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:weight-lifter
panel_title: Barbell Camera
services:
  - mqtt:want
hassio_api: true
homeassistant_api: true
map:
  - addon_config:rw
options:
  log_level: info
  config_file: /config/barbell.yaml
  discovery_prefix: homeassistant
schema:
  log_level: list(debug|info|warning|error)
  config_file: str
  # RTSP(S) URL of the overhead camera. Holds credentials, so it's a password field.
  camera_url: password?
  # Or, without a stream URL: a camera entity to take snapshots from (slower).
  camera_entity: str?
  # Optional: an entity that is "on" while someone is in the rack (e.g. a VisionState person sensor).
  person_entity: str?
  # Optional overrides (everything below can also be configured visually in the built-in Web UI).
  unit: list(lb|kg)?
  bar_weight: float?
  # weight[xcount]:diameter_mm/thickness_mm[:color], e.g. "45x4:450/76:red, 25:450/43:blue, 10:450/25:green"
  plates: str?
  # Fractions of the (undistorted) frame: "x,y x,y x,y x,y" around the sleeve and its plates
  sleeve_roi: str?
  # "x,y x,y": collar, then sleeve tip
  sleeve_axis: str?
  sleeve_length_mm: float?
  # For angled / 3/4 cameras: apparent overhang of the outer plate face along the axis (mm, 0 for overhead)
  outer_face_mm: float?
  # Measure plate thickness/slabs along the sleeve
  use_shape: bool?
  # Read colored electrical tape bands around the outer circumference of plates
  use_color: bool?
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
